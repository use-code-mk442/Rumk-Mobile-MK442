name: Build Rumk APK Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Rumk Android App
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract ZIP and locate Android project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found in repository root."
            ls -la
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          rm -rf build-src
          mkdir -p build-src
          unzip -q "$ZIP_FILE" -d build-src

          ANDROID_BUILD_FILE="$(find build-src -maxdepth 8 -type f -path '*/android/build.gradle' -print -quit)"

          if [ -z "$ANDROID_BUILD_FILE" ]; then
            echo "::error::Android project not found inside ZIP."
            find build-src -maxdepth 8 -type f -print | head -100
            exit 1
          fi

          ANDROID_DIR="${ANDROID_BUILD_FILE%/build.gradle}"
          PROJECT_DIR="${ANDROID_DIR%/android}"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix missing SuppressLint import
        shell: bash
        run: |
          MAIN_ACTIVITY="$(find "$ANDROID_DIR/app/src/main/java" -type f -name 'MainActivity.java' -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ] || [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found."
            exit 1
          fi

          if ! grep -q 'import android.annotation.SuppressLint;' "$MAIN_ACTIVITY"; then
            sed -i '/^package [^;]*;/a import android.annotation.SuppressLint;' "$MAIN_ACTIVITY"
            echo "Fixed missing SuppressLint import."
          else
            echo "SuppressLint import already exists."
          fi

          sed -n '1,24p' "$MAIN_ACTIVITY"

      - name: Prepare Rumk files
        shell: bash
        run: |
          python3 "$PROJECT_DIR/sync_web_assets.py"

      - name: Build Android APK
        shell: bash
        run: |
          gradle --no-daemon \
            -p "$GITHUB_WORKSPACE/$ANDROID_DIR" \
            assembleDebug \
            --stacktrace

      - name: Upload finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Rumk-MK442-Android-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
